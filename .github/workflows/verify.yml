name: Verify design system

on:
  pull_request:
    paths:
      - "tokens/**/*.json"
      - "build.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "test/**"
      - ".github/workflows/verify.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code -- build
